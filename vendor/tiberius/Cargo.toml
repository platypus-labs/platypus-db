# tiberius 0.12.3 (https://github.com/prisma/tiberius), MIT/Apache-2.0, with the patches
# PlatypusDB's SQL Server driver needs. Only the `rustls` and `tds73` features are kept.
#
# Patches (search for `PlatypusDB:` in the sources):
# - reading never panics: UDT columns (geometry, geography, hierarchyid) are read as
#   binary, `sql_variant` values as their base type, unknown tokens and lengths are errors,
#   missing platform certificates are an error;
# - `Client::cancel` sends an attention and discards the response up to its acknowledgment;
# - `Client::send_batch` and `Client::batch_results` split `simple_query` into its sending
#   and reading halves, so the reading half can be abandoned and cancelled;
# - `QueryStream::rows_affected` sums the row counts of the statements without results;
# - `Column::precision`, `Column::scale` and `Column::max_length` describe the column type.
[package]
edition = "2021"
name = "tiberius"
version = "0.12.3"
description = "A TDS (MSSQL) driver, patched for PlatypusDB"
license = "MIT/Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
asynchronous-codec = "0.6"
byteorder = "1.0"
bytes = "1.0"
connection-string = "0.2"
encoding_rs = "0.8"
enumflags2 = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["io", "sink"] }
num-traits = "0.2"
once_cell = "1.3"
pin-project-lite = "0.2"
pretty-hex = "0.3"
rustls-native-certs = { version = "0.6", optional = true }
rustls-pemfile = { version = "1", optional = true }
thiserror = "1.0"
tokio-rustls = { version = "0.24.0", features = ["dangerous_configuration"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
tracing = { version = "0.1", features = ["log"] }
uuid = "1.0"

[features]
default = ["tds73", "rustls"]
rustls = ["tokio-rustls", "tokio-util", "rustls-pemfile", "rustls-native-certs"]
tds73 = []

[lints.rust]
# The upstream sources keep their code for the features dropped here.
unexpected_cfgs = "allow"
dead_code = "allow"
deprecated = "allow"
