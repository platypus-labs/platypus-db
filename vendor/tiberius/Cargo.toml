# tiberius 0.12.3 (https://github.com/prisma/tiberius), MIT/Apache-2.0, with the patches
# PlatypusDB's SQL Server driver needs. Only the `rustls` and `tds73` features are kept.
#
# Patches (search for `PlatypusDB:` in the sources):
# - reading never panics: UDT columns (geometry, geography, hierarchyid) are read as
#   binary, `sql_variant` values as their base type, unknown tokens and lengths are errors,
#   missing platform certificates are an error;
# - `Client::cancel` sends an attention and discards the response up to its acknowledgment;
# - `Client::send_batch` and `Client::batch_results` split `simple_query` into its sending
#   and reading halves, so the reading half can be abandoned and cancelled;
# - `QueryStream::rows_affected` sums the row counts of the statements without results;
# - `Column::precision`, `Column::scale` and `Column::max_length` describe the column type;
# - the encryption negotiation follows the table of [MS-TDS], with an error instead of a
#   panic when client and server cannot agree;
# - `max` values (`varchar(max)`, `varbinary(max)`) are read a chunk at a time, and packets
#   copied whole, not a byte at a time.
# - `Client::bulk_columns` and `Client::bulk_insert_columns` split `bulk_insert` so that a
#   bulk load names its columns and hints, and the caller sees the column types first;
#   `INSERT BULK` quotes the names and declares national lengths, `time`,
#   `datetimeoffset` and `smalldatetime` as the server described them, and the bulk copy's
#   column metadata writes no length for `date`.
# - TLS goes through rustls 0.23 (tokio-rustls 0.26, the ring provider) instead of rustls 0.21,
#   with PEM files read by rustls-pki-types instead of rustls-pemfile.
[package]
edition = "2021"
name = "tiberius"
version = "0.12.3"
description = "A TDS (MSSQL) driver, patched for PlatypusDB"
license = "MIT/Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
asynchronous-codec = "0.6"
byteorder = "1.0"
bytes = "1.0"
connection-string = "0.2"
encoding_rs = "0.8"
enumflags2 = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["io", "sink"] }
num-traits = "0.2"
once_cell = "1.3"
pin-project-lite = "0.2"
pretty-hex = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
thiserror = "1.0"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
tracing = { version = "0.1", features = ["log"] }
uuid = "1.0"

# Windows' own sign-in (SSPI): the `winauth` feature.
[target.'cfg(windows)'.dependencies]
winauth = { version = "0.0.4", optional = true }

[features]
default = ["tds73", "rustls"]
rustls = ["dep:rustls", "tokio-rustls", "tokio-util", "rustls-native-certs"]
tds73 = []

[lints.rust]
# The upstream sources keep their code for the features dropped here.
unexpected_cfgs = "allow"
dead_code = "allow"
deprecated = "allow"

# A workspace of its own: the PlatypusDB one excludes it, and cargo must not look further
# up (`cargo fmt --all` fails in a checkout nested in another one).
[workspace]
