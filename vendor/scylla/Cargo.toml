# scylla 1.9.0 (https://github.com/scylladb/scylla-rust-driver), MIT/Apache-2.0, for the
# Cassandra/ScyllaDB driver. One change: `rustls` and `tokio-rustls` without their default
# features, which pull in the aws-lc-rs crypto provider. With it next to ring (the provider
# the app uses), rustls cannot pick a process default and every `ClientConfig::builder()`
# panics; the driver passes its own `ClientConfig`, built on ring, to scylla anyway.
#
# THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
rust-version = "1.88"
name = "scylla"
version = "1.9.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Async CQL driver for Rust, optimized for ScyllaDB, fully compatible with Apache Cassandra™"
readme = "README.md"
keywords = [
    "database",
    "scylla",
    "scylladb",
    "cql",
    "cassandra",
]
categories = ["database"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/scylladb/scylla-rust-driver"

[package.metadata."docs.rs"]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[package.metadata.cargo-semver-checks.lints]
workspace = true

[features]
bigdecimal-04 = [
    "scylla-cql/bigdecimal-04",
    "scylla-cql-core/bigdecimal-04",
]
chrono-04 = [
    "scylla-cql/chrono-04",
    "scylla-cql-core/chrono-04",
]
default = []
full-serialization = [
    "chrono-04",
    "time-03",
    "secrecy-08",
    "secrecy-10",
    "num-bigint-03",
    "num-bigint-04",
    "bigdecimal-04",
]
metrics = ["dep:histogram"]
num-bigint-03 = [
    "scylla-cql/num-bigint-03",
    "scylla-cql-core/num-bigint-03",
]
num-bigint-04 = [
    "scylla-cql/num-bigint-04",
    "scylla-cql-core/num-bigint-04",
]
openssl-010 = [
    "dep:tokio-openssl",
    "dep:openssl",
]
rustls-023 = [
    "dep:tokio-rustls",
    "dep:rustls",
]
secrecy-08 = ["scylla-cql/secrecy-08"]
secrecy-10 = ["scylla-cql/secrecy-10"]
time-03 = [
    "scylla-cql/time-03",
    "scylla-cql-core/time-03",
]
unstable-client-routes = []
unstable-cpp-rs = []
unstable-csharp-rs = []
unstable-host-listener = []
unstable-nodejs-rs = ["scylla-cql/unstable-nodejs-rs"]
unstable-python-rs = [
    "scylla-cql/unstable-python-rs",
    "scylla-cql-core/unstable-python-rs",
]
unstable-reconnect-policy = []
unstable-strong-consistency = []
unstable-testing = []

[lib]
name = "scylla"
path = "src/lib.rs"




[dependencies.arc-swap]
version = "1.3.0"

[dependencies.async-trait]
version = "0.1.56"

[dependencies.bytes]
version = "1.10"

[dependencies.chrono]
version = "0.4.32"
features = ["clock"]
default-features = false

[dependencies.dashmap]
version = "6.0"

[dependencies.futures]
version = "0.3.6"

[dependencies.hashbrown]
version = "0.17"

[dependencies.histogram]
version = "1"
optional = true

[dependencies.itertools]
version = "0.15.0"

[dependencies.openssl]
version = "0.10.70"
optional = true

[dependencies.rand]
version = "0.9.0"

[dependencies.rand_pcg]
version = "0.9.0"

[dependencies.rustls]
version = "0.23"
optional = true
default-features = false
features = ["logging", "std", "tls12"]

[dependencies.scylla-cql]
version = "=2.0.0"

[dependencies.scylla-cql-core]
version = "=1.9.0"

[dependencies.serde]
version = "1.0.184"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.smallvec]
version = "1.8.0"

[dependencies.socket2]
version = "0.6.0"
features = ["all"]

[dependencies.thiserror]
version = "2.0.6"

[dependencies.tokio]
version = "1.40"
features = [
    "net",
    "time",
    "io-util",
    "sync",
    "rt",
    "macros",
]

[dependencies.tokio-openssl]
version = "0.6.1"
optional = true

[dependencies.tokio-rustls]
version = "0.26"
optional = true
default-features = false
features = ["logging", "tls12"]

[dependencies.tracing]
version = "0.1.36"

[dependencies.uuid]
version = "1.0"
features = ["v4"]


















[lints.rust]
missing_docs = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(scylla_unstable)",
    "cfg(cassandra_tests)",
]
