# The test realm, for the KDC, the server and the client on the compose network.
[libdefaults]
    default_realm = PLATYPUS.TEST
    dns_canonicalize_hostname = false
    rdns = false
    dns_lookup_kdc = false
    dns_lookup_realm = false
    udp_preference_limit = 1

[realms]
    PLATYPUS.TEST = {
        kdc = kdc.platypus.test:88
    }

[domain_realm]
    .platypus.test = PLATYPUS.TEST
    platypus.test = PLATYPUS.TEST
