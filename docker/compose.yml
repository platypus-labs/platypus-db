# Local databases for development and integration tests.
# Test-only credentials: user `platypus`, password `platypus`, database `platypus`.
# Host ports are offset from the defaults to avoid clashing with local installs.
name: platypus-db

services:
  postgres:
    # Debian image: ships a self-signed "snakeoil" certificate, so TLS can be tested.
    image: postgres:17
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      # The costliest statements of the admin tab (CREATE EXTENSION pg_stat_statements).
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: platypus
      POSTGRES_PASSWORD: platypus
      POSTGRES_DB: platypus
    ports:
      - "55432:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platypus -d platypus"]
      interval: 2s
      timeout: 3s
      retries: 60

  # The PostgreSQL above behind PgBouncer in transaction mode, on 56432: the driver's pooler
  # mode (crates/platypus-driver-pg/tests/pooler.rs).
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    profiles: [pooler]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "56432:5432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro

  # PostgreSQL 17 with the PL/pgSQL debugger, on 55437: the routine debugger and its tests
  # (crates/platypus-conformance/tests/debugger.rs). Not started by default, since its image
  # is built: `docker compose -f docker/compose.yml --profile pldebug up -d --build --wait`.
  # The `pldbgapi` extension is left to create: the tests install it, as the app offers to.
  postgres-pldebug:
    build: ./postgres-pldebug
    image: platypus-db/postgres-pldebug:17
    profiles: [pldebug]
    command:
      - -c
      - shared_preload_libraries=plugin_debugger
    environment:
      POSTGRES_USER: platypus
      POSTGRES_PASSWORD: platypus
      POSTGRES_DB: platypus
    ports:
      - "55437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platypus -d platypus"]
      interval: 2s
      timeout: 3s
      retries: 60

  mysql:
    image: mysql:8.4
    # Binary logging is on by default; without this only SUPER may create triggers and
    # functions, which the app and the tests do as the `platypus` user.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_USER: platypus
      MYSQL_PASSWORD: platypus
      MYSQL_DATABASE: platypus
      MYSQL_ROOT_PASSWORD: platypus
    ports:
      - "53306:3306"
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uplatypus", "-pplatypus"]
      interval: 2s
      timeout: 3s
      retries: 90

  mariadb:
    image: mariadb:11.4
    # 64 MB as MySQL 8.4 (MariaDB's default is 16 MB): the scale tests read cells of 32 MB.
    # performance_schema, off by default in MariaDB: the costliest statements of the admin tab.
    command: --max-allowed-packet=64M --performance-schema=ON
    environment:
      MARIADB_USER: platypus
      MARIADB_PASSWORD: platypus
      MARIADB_DATABASE: platypus
      MARIADB_ROOT_PASSWORD: platypus
    ports:
      - "53307:3306"
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 90

  # Over HTTP on 58123; the conformance tests create their demo tables.
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.25.2
    environment:
      CLICKHOUSE_USER: platypus
      CLICKHOUSE_PASSWORD: platypus
      CLICKHOUSE_DB: platypus
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "58123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "platypus", "--password", "platypus", "-q", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Redis Stack: Redis with RedisJSON, for the JSON keys. The default user's password is
  # `platypus`; the tests fill and empty their own databases.
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    environment:
      REDIS_ARGS: "--requirepass platypus"
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "platypus", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Not started by default (a large image): `docker compose --profile sqlserver up -d --wait`.
  # The image runs no seed scripts: the healthcheck creates the `platypus` database and the
  # conformance tests create their demo schema. Test-only login: `sa`, `Platypus-2026`.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [sqlserver]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Platypus-2026
    ports:
      - "51433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
          -Q "IF DB_ID('platypus') IS NULL CREATE DATABASE platypus"
      interval: 2s
      timeout: 10s
      retries: 90
      start_period: 10s

  # Not started by default: `docker compose --profile mongo up -d --wait`. The root user
  # `platypus` / `platypus` authenticates against `admin`; the seed fills the `platypus`
  # database.
  mongo:
    image: mongo:8.0.32
    profiles: [mongo]
    environment:
      MONGO_INITDB_ROOT_USERNAME: platypus
      MONGO_INITDB_ROOT_PASSWORD: platypus
    ports:
      - "57017:27017"
    volumes:
      - ./mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "platypus", "-p", "platypus", "--eval", "if (!db.getSiblingDB('platypus').getCollectionNames().includes('customer_totals')) quit(1)"]
      interval: 2s
      timeout: 10s
      retries: 90
      start_period: 5s

  # Older versions of the databases, not started by default:
  # `docker compose --profile versions up -d --wait`, then `node scripts/conformance-versions.mjs`
  # runs the conformance suite on each. The oldest of each is the minimum the app supports
  # (`platypus_core::minimum_version`). The images run the same seeds as the newest ones.
  postgres-12:
    image: postgres:12-alpine
    profiles: [versions]
    environment: &postgres-env
      POSTGRES_USER: platypus
      POSTGRES_PASSWORD: platypus
      POSTGRES_DB: platypus
    ports:
      - "55412:5432"
    volumes: &postgres-seed
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck: &postgres-health
      test: ["CMD-SHELL", "pg_isready -U platypus -d platypus"]
      interval: 2s
      timeout: 3s
      retries: 60

  postgres-14:
    image: postgres:14-alpine
    profiles: [versions]
    environment: *postgres-env
    ports:
      - "55414:5432"
    volumes: *postgres-seed
    healthcheck: *postgres-health

  postgres-16:
    image: postgres:16-alpine
    profiles: [versions]
    environment: *postgres-env
    ports:
      - "55416:5432"
    volumes: *postgres-seed
    healthcheck: *postgres-health

  mysql-5.7:
    image: mysql:5.7
    profiles: [versions]
    # 64M as from 8.0 (5.7 allows 4M): the scale tests read cells of tens of megabytes.
    command: --log-bin-trust-function-creators=1 --max-allowed-packet=64M
    environment: &mysql-env
      MYSQL_USER: platypus
      MYSQL_PASSWORD: platypus
      MYSQL_DATABASE: platypus
      MYSQL_ROOT_PASSWORD: platypus
    ports:
      - "53357:3306"
    volumes: &mysql-seed
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck: &mysql-health
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uplatypus", "-pplatypus"]
      interval: 2s
      timeout: 3s
      retries: 90

  mysql-8.0:
    image: mysql:8.0
    profiles: [versions]
    command: --log-bin-trust-function-creators=1
    environment: *mysql-env
    ports:
      - "53380:3306"
    volumes: *mysql-seed
    healthcheck: *mysql-health

  mariadb-10.6:
    image: mariadb:10.6
    profiles: [versions]
    # 64M as from 10.6's successors (10.6 allows 16M), for the scale tests' large cells.
    command: --max-allowed-packet=64M
    environment:
      MARIADB_USER: platypus
      MARIADB_PASSWORD: platypus
      MARIADB_DATABASE: platypus
      MARIADB_ROOT_PASSWORD: platypus
    ports:
      - "53406:3306"
    volumes: *mysql-seed
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 90

  sqlserver-2017:
    image: mcr.microsoft.com/mssql/server:2017-latest
    profiles: [versions]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Platypus-2026
    ports:
      - "51417:1433"
    healthcheck:
      # 2017's tools are in mssql-tools, without the -C of 18.
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools/bin/sqlcmd -b -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
          -Q "IF DB_ID('platypus') IS NULL CREATE DATABASE platypus"
      interval: 2s
      timeout: 10s
      retries: 90
      start_period: 10s

  mongo-5:
    image: mongo:5.0
    profiles: [versions]
    environment:
      MONGO_INITDB_ROOT_USERNAME: platypus
      MONGO_INITDB_ROOT_PASSWORD: platypus
    ports:
      - "57005:27017"
    volumes:
      - ./mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "-u", "platypus", "-p", "platypus", "--eval", "if (!db.getSiblingDB('platypus').getCollectionNames().includes('customer_totals')) quit(1)"]
      interval: 2s
      timeout: 10s
      retries: 90
      start_period: 5s

  # PostgreSQL-compatible servers, not started by default:
  # `docker compose --profile pgwire up -d --wait`. TimescaleDB runs the PostgreSQL seed;
  # CockroachDB and YugabyteDB run none, and the conformance tests seed them.
  timescale:
    image: timescale/timescaledb:2.30.2-pg17
    profiles: [pgwire]
    environment:
      POSTGRES_USER: platypus
      POSTGRES_PASSWORD: platypus
      POSTGRES_DB: platypus
    ports:
      - "55433:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platypus -d platypus"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Insecure single node: user `root`, no password. The healthcheck turns temporary tables
  # on, experimental in CockroachDB and used by the conformance tests.
  cockroach:
    image: cockroachdb/cockroach:v26.2.7
    profiles: [pgwire]
    command: start-single-node --insecure
    environment:
      COCKROACH_DATABASE: platypus
    ports:
      - "56257:26257"
    healthcheck:
      test:
        - CMD
        - cockroach
        - sql
        - --insecure
        - -e
        - SET CLUSTER SETTING sql.defaults.experimental_temporary_tables.enabled = true
      interval: 2s
      timeout: 5s
      retries: 90

  # User `yugabyte`, password `yugabyte`, database `yugabyte`.
  yugabyte:
    image: yugabytedb/yugabyte:2025.2.6.0-b111
    profiles: [pgwire]
    command: bin/yugabyted start --background=false
    ports:
      - "55434:5433"
    healthcheck:
      test: ["CMD-SHELL", "bin/ysqlsh -h $$(hostname) -c 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 20s

  # libSQL server (sqld, what Turso runs), not started by default:
  # `docker compose --profile libsql up -d --wait`. HTTP on 58080, with JWT auth: the
  # public key below belongs to the test-only token in the conformance tests.
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33
    profiles: [libsql]
    environment:
      SQLD_NODE: primary
      SQLD_AUTH_JWT_KEY: d5YTU2j6c07m9XBnd9HP_Kc3XjXiHWiLJvRWPqYBf9c
    ports:
      - "58080:8080"
    # The image has no curl: bash opens the port.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Trino, reached through its ADBC driver, not started by default:
  # `docker compose --profile trino up -d --wait`. HTTP on 58085, any user, no password;
  # the `memory` catalog holds the tables the tests create.
  trino:
    image: trinodb/trino:484
    profiles: [trino]
    ports:
      - "58085:8080"
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  # Oracle Database Free, reached through Oracle's ODBC driver (Instant Client), not started
  # by default: `docker compose --profile oracle up -d --wait`. The image creates the user
  # `platypus` / `platypus` in the pluggable database (service) `FREEPDB1`.
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    profiles: [oracle]
    environment:
      ORACLE_PASSWORD: platypus
      APP_USER: platypus
      APP_USER_PASSWORD: platypus
    ports:
      - "51521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 10s

  # Elasticsearch 8 with security on, plain HTTP, not started by default (the JVM takes
  # memory): `docker compose --profile search up -d --wait elasticsearch`. Test-only login:
  # `elastic` / `platypus`. The heap is capped at 512 MB.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: [search]
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: platypus
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      xpack.watcher.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "59200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:platypus localhost:9200/_cluster/health"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  # OpenSearch 2 without its security plugin (plain HTTP, no login), same profile.
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    profiles: [search]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "59201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  # Apache Cassandra 5, not started by default (the JVM takes memory and a node needs about a
  # minute to open its CQL port): `docker compose --profile cassandra up -d --wait cassandra`.
  # Test-only login `cassandra` / `cassandra` (the password authenticator's default user).
  # Materialized views and user-defined functions, off by default, are turned on for the
  # catalog tests. The heap is capped at 512 MB.
  cassandra:
    image: cassandra:5
    profiles: [cassandra]
    entrypoint:
      - sh
      - -c
      - >-
        sed -i
        -e 's/^authenticator:.*/authenticator: PasswordAuthenticator/'
        -e 's/^materialized_views_enabled:.*/materialized_views_enabled: true/'
        -e 's/^user_defined_functions_enabled:.*/user_defined_functions_enabled: true/'
        /etc/cassandra/cassandra.yaml
        && exec docker-entrypoint.sh cassandra -f
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "59042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'describe keyspaces'"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

  # ScyllaDB (CQL-compatible), one shard and a small memory budget, user-defined functions on
  # (Lua), started with
  # `docker compose --profile scylla up -d --wait scylla`.
  scylla:
    image: scylladb/scylla:2025.1
    profiles: [scylla]
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1 --enable-user-defined-functions 1 --experimental-features udf
    ports:
      - "59043:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s
