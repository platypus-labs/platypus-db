# Local databases for development and integration tests.
# Test-only credentials: user `platypus`, password `platypus`, database `platypus`.
# Host ports are offset from the defaults to avoid clashing with local installs.
name: platypus-db

services:
  postgres:
    # Debian image: ships a self-signed "snakeoil" certificate, so TLS can be tested.
    image: postgres:17
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    environment:
      POSTGRES_USER: platypus
      POSTGRES_PASSWORD: platypus
      POSTGRES_DB: platypus
    ports:
      - "55432:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platypus -d platypus"]
      interval: 2s
      timeout: 3s
      retries: 60

  mysql:
    image: mysql:8.4
    # Binary logging is on by default; without this only SUPER may create triggers and
    # functions, which the app and the tests do as the `platypus` user.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_USER: platypus
      MYSQL_PASSWORD: platypus
      MYSQL_DATABASE: platypus
      MYSQL_ROOT_PASSWORD: platypus
    ports:
      - "53306:3306"
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uplatypus", "-pplatypus"]
      interval: 2s
      timeout: 3s
      retries: 90

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_USER: platypus
      MARIADB_PASSWORD: platypus
      MARIADB_DATABASE: platypus
      MARIADB_ROOT_PASSWORD: platypus
    ports:
      - "53307:3306"
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 90

  # Not started by default (a large image): `docker compose --profile sqlserver up -d --wait`.
  # The image runs no seed scripts: the healthcheck creates the `platypus` database and the
  # conformance tests create their demo schema. Test-only login: `sa`, `Platypus-2026`.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [sqlserver]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Platypus-2026
    ports:
      - "51433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
          -Q "IF DB_ID('platypus') IS NULL CREATE DATABASE platypus"
      interval: 2s
      timeout: 10s
      retries: 90
      start_period: 10s

  # PostgreSQL-compatible servers, not started by default:
  # `docker compose --profile pgwire up -d --wait`. TimescaleDB runs the PostgreSQL seed;
  # CockroachDB and YugabyteDB run none, and the conformance tests seed them.
  timescale:
    image: timescale/timescaledb:2.30.2-pg17
    profiles: [pgwire]
    environment:
      POSTGRES_USER: platypus
      POSTGRES_PASSWORD: platypus
      POSTGRES_DB: platypus
    ports:
      - "55433:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platypus -d platypus"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Insecure single node: user `root`, no password. The healthcheck turns temporary tables
  # on, experimental in CockroachDB and used by the conformance tests.
  cockroach:
    image: cockroachdb/cockroach:v26.2.7
    profiles: [pgwire]
    command: start-single-node --insecure
    environment:
      COCKROACH_DATABASE: platypus
    ports:
      - "56257:26257"
    healthcheck:
      test:
        - CMD
        - cockroach
        - sql
        - --insecure
        - -e
        - SET CLUSTER SETTING sql.defaults.experimental_temporary_tables.enabled = true
      interval: 2s
      timeout: 5s
      retries: 90

  # User `yugabyte`, password `yugabyte`, database `yugabyte`.
  yugabyte:
    image: yugabytedb/yugabyte:2025.2.6.0-b111
    profiles: [pgwire]
    command: bin/yugabyted start --background=false
    ports:
      - "55434:5433"
    healthcheck:
      test: ["CMD-SHELL", "bin/ysqlsh -h $$(hostname) -c 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 20s

  # libSQL server (sqld, what Turso runs), not started by default:
  # `docker compose --profile libsql up -d --wait`. HTTP on 58080, with JWT auth: the
  # public key below belongs to the test-only token in the conformance tests.
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33
    profiles: [libsql]
    environment:
      SQLD_NODE: primary
      SQLD_AUTH_JWT_KEY: d5YTU2j6c07m9XBnd9HP_Kc3XjXiHWiLJvRWPqYBf9c
    ports:
      - "58080:8080"
    # The image has no curl: bash opens the port.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 3s
      retries: 60
