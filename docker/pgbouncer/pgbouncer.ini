; PgBouncer in transaction mode, as the hosted poolers (Supabase's, Neon's) run it, and a
; little harsher: no prepared statements kept, and each server session reset after every
; transaction, so a statement prepared with a name in one round trip is gone at the next.
[databases]
platypus = host=postgres port=5432 dbname=platypus user=platypus password=platypus

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 0
server_reset_query = DISCARD ALL
server_reset_query_always = 1
default_pool_size = 2
ignore_startup_parameters = extra_float_digits,application_name,options
