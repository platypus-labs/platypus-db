[package]
name = "platypus-cli"
description = "Command-line client for PlatypusDB, used to exercise the core without the UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "platypus"
path = "src/main.rs"

[dependencies]
arrow-array.workspace = true
arrow-cast = { workspace = true, features = ["prettyprint"] }
arrow-csv.workspace = true
arrow-json.workspace = true
arrow-schema.workspace = true
clap.workspace = true
futures.workspace = true
platypus-core.workspace = true
platypus-driver-duckdb.workspace = true
platypus-driver-mysql.workspace = true
platypus-driver-pg.workspace = true
platypus-driver-sqlite.workspace = true
platypus-export.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }

[lints]
workspace = true
