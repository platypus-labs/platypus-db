[package]
name = "platypus-driver-oracle"
description = "PlatypusDB driver for Oracle Database, through Oracle's client library (Instant Client)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
futures.workspace = true
# ODPI-C, which loads Oracle's client library at run time: the app starts without it.
oracle = "0.6"
platypus-core.workspace = true
platypus-drivers.workspace = true
platypus-sql.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
