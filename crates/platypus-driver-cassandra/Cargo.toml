[package]
name = "platypus-driver-cassandra"
description = "Apache Cassandra and ScyllaDB driver for PlatypusDB, over CQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "platypus_driver_cassandra"

[dependencies]
arrow-array.workspace = true
arrow-cast.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
futures.workspace = true
platypus-core.workspace = true
platypus-tls.workspace = true
scylla = { version = "1.9.0", default-features = false, features = ["rustls-023"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "net"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
