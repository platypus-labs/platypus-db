[package]
name = "platypus-mcp"
description = "PlatypusDB for external agents: an MCP server over stdio on the saved connections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "platypus_mcp"
path = "src/lib.rs"

[[bin]]
name = "platypus-mcp"
path = "src/main.rs"

[dependencies]
arrow-array.workspace = true
async-trait.workspace = true
arrow-cast.workspace = true
arrow-schema.workspace = true
dirs = "7"
futures.workspace = true
platypus-core.workspace = true
platypus-docs.workspace = true
platypus-driver-adbc.workspace = true
platypus-driver-odbc.workspace = true
platypus-driver-oracle.workspace = true
platypus-drivers.workspace = true
platypus-local.workspace = true
platypus-driver-clickhouse.workspace = true
platypus-driver-duckdb.workspace = true
platypus-driver-libsql.workspace = true
platypus-driver-mongo.workspace = true
platypus-driver-redis.workspace = true
platypus-driver-search.workspace = true
platypus-driver-cassandra.workspace = true
platypus-driver-mssql.workspace = true
platypus-driver-mysql.workspace = true
platypus-driver-pg.workspace = true
platypus-driver-sqlite.workspace = true
platypus-plugins.workspace = true
platypus-net.workspace = true
platypus-schema.workspace = true
platypus-sql.workspace = true
platypus-store.workspace = true
platypus-sync.workspace = true
ring.workspace = true
rmcp = { version = "3.7", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "net", "io-util"] }
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
duckdb.workspace = true
platypus-driver-duckdb = { workspace = true, features = ["testing"] }
rusqlite.workspace = true
tempfile.workspace = true

[features]
# The server on HTTP, for the app's bridge.
http = ["rmcp/transport-streamable-http-server"]

[lints]
workspace = true
