[package]
name = "platypus-driver-clickhouse"
description = "ClickHouse driver for PlatypusDB, over HTTP with Arrow results"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrow-array.workspace = true
arrow-buffer = "60"
arrow-cast.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
platypus-core.workspace = true
platypus-sql.workspace = true
platypus-tls.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
