[package]
name = "platypus-net"
description = "Network paths to database servers for PlatypusDB: SSH tunnels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
platypus-core.workspace = true
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "macros"] }

[dev-dependencies]
futures.workspace = true
platypus-driver-mysql.workspace = true
platypus-driver-pg.workspace = true
rand = "0.10"
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
