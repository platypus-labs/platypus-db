[package]
name = "platypus-driver-redis"
description = "Redis driver for PlatypusDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
futures.workspace = true
platypus-core.workspace = true
platypus-tls.workspace = true
redis = { version = "1.8", default-features = false, features = ["tokio-comp"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "net", "time", "rt", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
