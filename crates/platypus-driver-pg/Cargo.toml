[package]
name = "platypus-driver-pg"
description = "PostgreSQL driver for PlatypusDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Kerberos logins (SSPI on Windows, GSSAPI elsewhere). Off by default: on Linux and macOS it links
# the system's Kerberos library and needs its headers to build.
kerberos = ["tokio-postgres/kerberos"]

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
bytes.workspace = true
fallible-iterator.workspace = true
futures.workspace = true
platypus-core.workspace = true
platypus-sql.workspace = true
platypus-tls.workspace = true
postgres-protocol.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true

[dev-dependencies]
arrow-cast.workspace = true
criterion.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
