[package]
name = "platypus-desktop"
description = "PlatypusDB desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "platypus_desktop"

[[bin]]
name = "platypus-db"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = { version = "3", default-features = false }
arrow-array.workspace = true
arrow-cast.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures.workspace = true
platypus-core.workspace = true
platypus-driver-duckdb.workspace = true
platypus-driver-libsql.workspace = true
platypus-driver-mssql.workspace = true
platypus-driver-mysql.workspace = true
platypus-driver-pg.workspace = true
platypus-driver-sqlite.workspace = true
platypus-export.workspace = true
platypus-net.workspace = true
platypus-sql.workspace = true
platypus-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { workspace = true, features = ["io-util", "process", "sync", "time"] }
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
