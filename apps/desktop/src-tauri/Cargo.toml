[package]
name = "platypus-desktop"
description = "PlatypusDB desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "platypus_desktop"

[[bin]]
name = "platypus-db"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = { version = "3", default-features = false }
arrow-array.workspace = true
arrow-cast.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
futures.workspace = true
bytes.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
platypus-core.workspace = true
platypus-docs.workspace = true
platypus-local.workspace = true
platypus-driver-adbc.workspace = true
platypus-driver-odbc.workspace = true
platypus-driver-oracle.workspace = true
platypus-drivers.workspace = true
platypus-driver-clickhouse.workspace = true
platypus-driver-duckdb.workspace = true
platypus-driver-libsql.workspace = true
platypus-driver-mongo.workspace = true
platypus-driver-mssql.workspace = true
platypus-driver-mysql.workspace = true
platypus-driver-pg.workspace = true
platypus-driver-sqlite.workspace = true
platypus-mcp = { workspace = true, features = ["http"] }
platypus-transfer.workspace = true
platypus-net.workspace = true
platypus-schema.workspace = true
platypus-sql.workspace = true
platypus-store.workspace = true
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-streamable-http-server"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "sync", "time"] }
tower-service = "0.3"
tokio-util.workspace = true
toml_edit = "0.25"
uuid.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[lints]
workspace = true

[dev-dependencies]
platypus-driver-duckdb = { workspace = true, features = ["testing"] }
tempfile.workspace = true
