[package]
name = "platypus-desktop"
description = "PlatypusDB desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "platypus_desktop"

[[bin]]
name = "platypus-db"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arrow-array.workspace = true
arrow-cast.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
futures.workspace = true
platypus-core.workspace = true
platypus-driver-mysql.workspace = true
platypus-driver-pg.workspace = true
platypus-driver-sqlite.workspace = true
platypus-export.workspace = true
platypus-sql.workspace = true
platypus-store.workspace = true
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { workspace = true, features = ["sync", "time"] }
uuid.workspace = true

[lints]
workspace = true
