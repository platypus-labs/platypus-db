[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
exclude = ["vendor/tiberius"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
platypus-core = { path = "crates/platypus-core" }
platypus-driver-duckdb = { path = "crates/platypus-driver-duckdb" }
platypus-driver-libsql = { path = "crates/platypus-driver-libsql" }
platypus-driver-pg = { path = "crates/platypus-driver-pg" }
platypus-driver-mysql = { path = "crates/platypus-driver-mysql" }
platypus-driver-mssql = { path = "crates/platypus-driver-mssql" }
platypus-driver-sqlite = { path = "crates/platypus-driver-sqlite" }
platypus-export = { path = "crates/platypus-export" }
platypus-net = { path = "crates/platypus-net" }
platypus-sql = { path = "crates/platypus-sql" }
platypus-store = { path = "crates/platypus-store" }

argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
arrow-array = "60"
arrow-cast = "60"
arrow-csv = "60"
arrow-ipc = "60"
arrow-json = "60"
arrow-schema = "60"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
criterion = "0.8"
duckdb = { version = "1.20000", features = ["bundled", "json", "parquet"] }
fallible-iterator = "0.2"
futures = "0.3"
keyring = "4"
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd", "simdutf8"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
percent-encoding = "2"
postgres-protocol = "0.6"
postgres-types = "0.2"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tiberius = { path = "vendor/tiberius", default-features = false, features = ["tds73", "rustls"] }
tokio = "1"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
tokio-util = "0.7"
toml = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
