[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
platypus-core = { path = "crates/platypus-core" }
platypus-driver-pg = { path = "crates/platypus-driver-pg" }
platypus-driver-mysql = { path = "crates/platypus-driver-mysql" }
platypus-driver-sqlite = { path = "crates/platypus-driver-sqlite" }
platypus-sql = { path = "crates/platypus-sql" }
platypus-store = { path = "crates/platypus-store" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
