<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Notes</title>
    <link rel="stylesheet" href="notes.css" />
  </head>
  <body>
    <h1 id="heading">Notes</h1>
    <p id="where"></p>
    <p id="greeting"></p>
    <textarea id="text" rows="8" placeholder="Written here, kept by the app"></textarea>
    <div class="buttons">
      <button id="save">Save</button>
      <button id="count">Count words</button>
      <button id="query">Open as a query</button>
      <button id="toast">Show a message</button>
    </div>
    <p id="result"></p>
    <script src="notes.js"></script>
  </body>
</html>
