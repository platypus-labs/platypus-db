# Repackages the Linux .deb of a release. The Flatpak ID is under io.github.platypus_labs, which
# Flathub verifies through the GitHub organization; the app's own identifier, and so its data
# folders, stay dev.platypusdb.desktop. Build and try it:
#   flatpak-builder --user --install --force-clean build io.github.platypus_labs.platypus-db.yml
#   flatpak run io.github.platypus_labs.platypus-db
id: io.github.platypus_labs.platypus-db
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: platypus-db
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # Database servers, SSH tunnels, the DuckDB download and the update check.
  - --share=network
  # SQLite and DuckDB files, CSV and Parquet, scripts and exports wherever the user keeps them.
  - --filesystem=home
  # The tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
  # The system keyring, for saved passwords.
  - --talk-name=org.freedesktop.secrets
modules:
  # The tray icon's library, which the GNOME runtime lacks: Flathub's shared module (add
  # https://github.com/flathub/shared-modules as the `shared-modules` git submodule).
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: platypusdb
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/platypus-labs/platypus-db/releases/download/v@VERSION@/PlatypusDB_@VERSION@_amd64.deb
        sha256: @SHA256_LINUX_DEB@
        dest-filename: platypusdb.deb
        only-arches: [x86_64]
      - type: file
        path: io.github.platypus_labs.platypus-db.metainfo.xml
    build-commands:
      - ar -x platypusdb.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/platypus-db /app/bin/platypus-db
      - install -Dm644 usr/share/applications/PlatypusDB.desktop /app/share/applications/io.github.platypus_labs.platypus-db.desktop
      - desktop-file-edit --set-icon=io.github.platypus_labs.platypus-db /app/share/applications/io.github.platypus_labs.platypus-db.desktop
      - |
        for icon in usr/share/icons/hicolor/*/apps/platypus-db.png; do
          size=$(basename "$(dirname "$(dirname "$icon")")")
          install -Dm644 "$icon" "/app/share/icons/hicolor/$size/apps/io.github.platypus_labs.platypus-db.png"
        done
      - install -Dm644 io.github.platypus_labs.platypus-db.metainfo.xml /app/share/metainfo/io.github.platypus_labs.platypus-db.metainfo.xml
      # Updates come from Flathub: the app then only says a new version is out.
      - install -d /app/share/platypusdb && echo Flatpak > /app/share/platypusdb/package-manager
