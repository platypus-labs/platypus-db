<!doctype html>
<!-- Source of social-preview.png, the repository's social preview (GitHub › Settings › Social
     preview, 1280×640). Render it again with: node scripts/social-preview.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlatypusDB social preview</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../site/fonts/inter-latin-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; src: url("../../site/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); }
  :root {
    --bg: #0b0d0f; --card: #14171a; --line: #24292d; --fg: #d5dadd; --hi: #f5f6f7; --mut: #8d969b;
    --acc: #ff8d28; --acc-2: #ffb36b; --acc-3: #ff5e3a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Inter", sans-serif;
    color: var(--fg);
    background:
      radial-gradient(700px 420px at 78% 10%, rgba(255, 141, 40, 0.16), transparent 70%),
      radial-gradient(600px 460px at 8% 90%, rgba(127, 200, 219, 0.07), transparent 70%),
      var(--bg);
  }
  .text { position: absolute; left: 72px; top: 76px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 76px; height: 76px; }
  .brand b { font-size: 40px; font-weight: 750; color: var(--hi); letter-spacing: -0.02em; }
  h1 {
    margin-top: 44px; font-size: 68px; line-height: 1.04; font-weight: 800; letter-spacing: -0.035em;
    color: var(--hi);
  }
  h1 span {
    background: linear-gradient(95deg, var(--acc-2), var(--acc) 40%, var(--acc-3));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { margin-top: 26px; font-size: 23px; line-height: 1.45; color: var(--mut); }
  p b { color: var(--fg); font-weight: 600; }
  .chips { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 10px; flex-wrap: wrap; width: 600px; }
  .chips span {
    font: 500 16px "JetBrains Mono", monospace; padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .chips span::before {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 8px; vertical-align: 1px; background: var(--c);
  }
  .shot {
    position: absolute; left: 690px; top: 92px; width: 760px;
    border-radius: 14px; border: 1px solid #343b40; overflow: hidden;
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6), 0 0 0 8px rgba(255, 141, 40, 0.06);
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../../site/img/mark.png" alt=""><b>PlatypusDB</b></div>
    <h1>Small app.<br><span>Every database.</span></h1>
    <p>Open-source SQL client in <b>Rust</b>. Opens in half a second, scrolls millions of rows, talks to AI agents over <b>MCP</b>.</p>
  </div>
  <div class="chips">
    <span style="--c:#4169E1">PostgreSQL</span>
    <span style="--c:#00a3d9">MySQL</span>
    <span style="--c:#cc2927">SQL Server</span>
    <span style="--c:#7fc8db">SQLite</span>
    <span style="--c:#FFF000">DuckDB</span>
    <span style="--c:#f80000">Oracle</span>
    <span style="--c:#8d969b">+ a dozen more</span>
  </div>
  <div class="shot"><img src="../screenshots/data-viewer.png" alt=""></div>
</body>
</html>
