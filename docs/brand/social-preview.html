<!doctype html>
<!-- Source of social-preview.png, the repository's social preview (GitHub › Settings › Social
     preview, 1280×640). Render it again with: node scripts/social-preview.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlatypusDB social preview</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../site/fonts/inter-latin-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; src: url("../../site/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); }
  :root { --bg: #141519; --line: #2a2d35; --hi: #f2f3f5; --fg: #c9ccd2; --mut: #80868f; --acc: #ff8d28; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { position: relative; background: var(--bg); color: var(--fg); font-family: "Inter", sans-serif; }
  .text { position: absolute; left: 72px; top: 72px; bottom: 64px; width: 548px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 64px; height: 64px; }
  .brand b { font-size: 38px; font-weight: 700; letter-spacing: -0.02em; color: var(--hi); }
  .brand b span { color: var(--acc); }
  h1 {
    margin-top: 56px;
    font-size: 48px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em; color: var(--hi);
  }
  p { margin-top: 22px; font-size: 21px; line-height: 1.5; color: var(--fg); }
  .dbs {
    margin-top: auto;
    font: 400 15px/1.7 "JetBrains Mono", monospace; color: var(--mut);
    border-top: 1px solid var(--line); padding-top: 18px;
  }
  .shot {
    position: absolute; left: 668px; top: 72px; width: 760px; height: 496px;
    border: 1px solid var(--line); border-right: 0; border-radius: 8px 0 0 8px; overflow: hidden;
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="platypus-mark.svg" alt=""><b>Platypus<span>DB</span></b></div>
    <h1>A fast, small SQL client for many databases.</h1>
    <p>Rust core, Tauri interface. Opens in half a second, scrolls millions of rows. Open source.</p>
    <div class="dbs">PostgreSQL · MySQL · SQL Server · Oracle · SQLite · and more</div>
  </div>
  <div class="shot"><img src="../screenshots/data-viewer.png" alt=""></div>
</body>
</html>
