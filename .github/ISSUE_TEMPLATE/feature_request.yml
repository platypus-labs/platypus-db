name: Feature request
description: Suggest something PlatypusDB should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Planned work is in docs/dev/ROADMAP.md: check whether the feature is already there.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you would like
      description: How it could work in the app. Screenshots of other tools are welcome.
    validations:
      required: true
  - type: input
    id: databases
    attributes:
      label: Databases concerned
      placeholder: "All, or PostgreSQL, SQL Server, ..."
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you do now, or other ways to get there.
