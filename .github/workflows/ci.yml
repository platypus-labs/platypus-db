name: CI

# Started by hand only (Actions tab, or `gh workflow run ci.yml`): during development the
# checks run locally, see "GitHub Actions" in CLAUDE.md.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The desktop crate needs the built frontend and WebKitGTK; it is checked in the `desktop` job.
      - run: cargo clippy --workspace --exclude platypus-desktop --all-targets
      - run: cargo test --workspace --exclude platypus-desktop

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libkrb5-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: cargo clippy -p platypus-desktop --all-targets
      - run: npm run tauri build -- --no-bundle
      # Drives the built app through the WebView2 DevTools protocol; scenarios that need
      # the dev databases skip themselves here.
      - name: End-to-end tests
        if: runner.os == 'Windows'
        run: npm run e2e
        env:
          PLATYPUS_E2E_SHOTS: ${{ runner.temp }}/e2e-shots
      - name: Upload E2E screenshots
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore

  # Thresholds in scripts/bench-thresholds.json: decoding, then the start and memory of the
  # release build under a virtual display.
  bench:
    name: Benchmarks (thresholds)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb xdotool
          python3 -m pip install pillow
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: cargo bench -p platypus-driver-pg --bench decode -- --noplot
      - run: python3 scripts/bench.py decode
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run tauri build -- --no-bundle
        working-directory: apps/desktop
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" python3 scripts/bench.py app target/release/platypus-db

  integration:
    name: Integration (dev databases)
    runs-on: ubuntu-latest
    env:
      PLATYPUS_TEST_PG_URL: postgres://platypus:platypus@localhost:55432/platypus?sslmode=disable
      PLATYPUS_TEST_MYSQL_URL: mysql://platypus:platypus@localhost:53306/platypus
      PLATYPUS_TEST_MARIADB_URL: mysql://platypus:platypus@localhost:53307/platypus
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker compose -f docker/compose.yml up -d --wait
      - name: Check seed data
        run: |
          docker compose -f docker/compose.yml exec -T postgres \
            psql -U platypus -d platypus -tAc "select count(*) from demo.big_table" | grep -x 1000000
          docker compose -f docker/compose.yml exec -T mysql \
            mysql -uplatypus -pplatypus platypus -NBe "select count(*) from big_table" | grep -x 1000000
          docker compose -f docker/compose.yml exec -T mariadb \
            mariadb -uplatypus -pplatypus platypus -NBe "select count(*) from big_table" | grep -x 1000000
      # With the PLATYPUS_TEST_*_URL variables set, the tests fail instead of skipping.
      - run: cargo test -p platypus-driver-pg --test pg
      - run: cargo test -p platypus-conformance
      - if: failure()
        run: docker compose -f docker/compose.yml logs
